<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galactic Warriors</title>
  <style>
    :root {
      --bg: #070b14;
      --bg2: #101827;
      --text: #edf5ff;
      --muted: #a7b9d6;
      --accent: #8ec5ff;
      --accent2: #b995ff;
      --gold: #f6d365;
      --line: rgba(255,255,255,0.1);
      --shadow: rgba(0,0,0,0.35);
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background:
        radial-gradient(circle at top, rgba(142,197,255,0.18), transparent 30%),
        radial-gradient(circle at bottom right, rgba(185,149,255,0.15), transparent 25%),
        linear-gradient(160deg, var(--bg), var(--bg2));
      color: var(--text);
      line-height: 1.8;
      min-height: 100vh;
    }

    .container {
      width: min(1100px, 90%);
      margin: 0 auto;
    }

    header {
      position: sticky;
      top: 0;
      backdrop-filter: blur(12px);
      background: rgba(7, 11, 20, 0.65);
      border-bottom: 1px solid var(--line);
      z-index: 20;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 0;
    }

    .brand {
      font-size: 1.08rem;
      letter-spacing: 0.14rem;
      text-transform: uppercase;
      font-weight: 700;
    }

    .nav-links {
      display: flex;
      gap: 22px;
      flex-wrap: wrap;
    }

    .nav-links a {
      text-decoration: none;
      color: var(--muted);
      font-size: 0.92rem;
      transition: color 0.2s ease;
    }

    .nav-links a:hover { color: var(--text); }

    .hero {
      padding: 80px 0 30px;
    }

    .hero-box {
      background: linear-gradient(135deg, rgba(142,197,255,0.08), rgba(185,149,255,0.06));
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 38px 36px;
      box-shadow: 0 30px 60px var(--shadow);
    }

    .eyebrow {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(246,211,101,0.12);
      border: 1px solid rgba(246,211,101,0.25);
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: 0.12rem;
      font-size: 0.72rem;
      font-weight: 700;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.7rem, 5vw, 5rem);
      line-height: 1.08;
      letter-spacing: -0.05em;
    }

    .subtitle {
      margin-top: 18px;
      color: var(--muted);
      font-size: 1.15rem;
    }

    .meta {
      margin-top: 28px;
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .meta span {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 12px;
    }

    .story-wrapper {
      margin-top: 20px;
      background: rgba(15, 23, 42, 0.78);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 28px 20px;
      box-shadow: 0 20px 50px var(--shadow);
    }

    .chapter-label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.16rem;
      color: var(--gold);
      margin-bottom: 14px;
      font-weight: 700;
    }

    .chapter-counter {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 16px;
    }

    .story {
      max-width: 900px;
      margin: 0 auto;
    }

    .story p {
      margin: 1.4em 0;
      color: #eef5ff;
      font-size: 1.08rem;
      text-align: justify;
      text-wrap: pretty;
    }

    .story p:first-child::first-letter {
      font-size: 2.1em;
      font-weight: 700;
      color: var(--gold);
      float: left;
      line-height: 1;
      margin-right: 0.12em;
      margin-top: 0.15em;
    }

    .controls {
      margin-top: 30px;
      display: flex;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .nav-btn {
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.04);
      color: var(--text);
      border-radius: 999px;
      padding: 12px 22px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .nav-btn:hover {
      background: rgba(142,197,255,0.08);
      border-color: rgba(142,197,255,0.35);
      transform: translateY(-1px);
    }

    .nav-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    footer {
      padding: 30px 0 60px;
      color: var(--muted);
      text-align: center;
      border-top: 1px solid var(--line);
      background: rgba(7,11,20,0.4);
    }

    @media (max-width: 700px) {
      nav {
        flex-direction: column;
        gap: 10px;
      }

      .hero-box {
        padding: 28px 20px;
      }

      .story-wrapper {
        padding: 18px 12px;
      }

      .story p {
        font-size: 1rem;
      }

      .controls {
        flex-direction: column;
      }

      .nav-btn {
        width: 100%;
      }
    }
  </style>
</head>

    const storyContent = document.getElementById("storyContent");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");

    function renderChapter() {
      const chapter = chapters[currentIndex];
      chapterTitle.textContent = chapter.title;
      chapterCounter.textContent = `${currentIndex + 1} / ${chapters.length}`;

      storyContent.innerHTML = "";

      const paragraphs = chapter.text
        .split(/\n\s*\n/)
        .map(p => p.trim())
        .filter(Boolean);

      paragraphs.forEach(paragraph => {
        const p = document.createElement("p");
        p.textContent = paragraph;
        storyContent.appendChild(p);
      });

      prevBtn.disabled = currentIndex === 0;
      prevBtn.style.visibility = currentIndex === 0 ? "hidden" : "visible";

      if (currentIndex < chapters.length - 1) {
        nextBtn.textContent = "Next Chapter";
        nextBtn.disabled = false;
      } else {
        nextBtn.textContent = "End of Story";
        nextBtn.disabled = true;
      }

      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    prevBtn.addEventListener("click", () => {
      if (currentIndex > 0) {
        currentIndex--;
        renderChapter();
      }
    });

    nextBtn.addEventListener("click", () => {
      if (currentIndex < chapters.length - 1) {
        currentIndex++;
        renderChapter();
      }
    });

    renderChapter();
  </script>
</body>
</html>
